# See https://pre-commit.com
repos:
  - repo: local
    hooks:
      - id: sync-kustomization-files
        name: sync kustomization.yaml policy files
        entry: python3 scripts/sync-kustomization-files.py --fail-on-change
        language: system
        pass_filenames: false
        files: ^(policies/.*\.rego|kustomization\.yaml)$
