apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aap-opa

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: opa-policies
    files:
      - policies/examples/allowed_false.rego
      - policies/examples/extra_vars_allowlist.rego
      - policies/examples/extra_vars_validation.rego
      - policies/examples/github_repo_validation.rego
      - policies/examples/global_credential_allowed_false.rego
      - policies/examples/jt_naming_validation.rego
      - policies/examples/maintenance_window.rego
      - policies/examples/mismatch_prefix_allowed_false.rego
      - policies/examples/project_scm_branch.rego
      - policies/examples/restrict_inv_use_to_org.rego
      - policies/examples/superuser_allowed_false.rego
      - policies/examples/team_based_extra_vars_restriction.rego
